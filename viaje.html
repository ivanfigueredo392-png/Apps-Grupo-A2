<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Europa 2027</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Figtree:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
:root{
  --bg:#EDF0F3; --surface:#FFFFFF; --surface-2:#F5F7F9; --ink:#15202B; --ink-2:#4A5866; --ink-3:#7A8692;
  --line:#D8DEE4; --accent:#1D5C8C; --accent-ink:#FFFFFF; --accent-soft:#DCE8F2;
  --warn:#9A5B0B; --warn-soft:#FBEBD2; --ok:#24724A; --ok-soft:#D9EFE1; --danger:#B3363A; --danger-soft:#F7DEDF;
  --hatch:#C9D1D8; --shadow:0 10px 30px rgba(21,32,43,.14);
  --sea:#C9DDE8; --sea-halo:#DCEAF1; --sea-ink:#557A92; --grat:rgba(60,100,130,.10); --land:#F3F2EA; --land-2:#DCDDD3; --land-near:#E9EADF; --sug:#B5541C; --sug-ink:#8A3E12; --land-line:#B7BCB0; --land-line-2:#9AA192; --now:#E0612F;
  --f-display:"Young Serif", Georgia, "Times New Roman", serif;
  --f-body:"Figtree", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0E141A; --surface:#161F28; --surface-2:#1C2731; --ink:#E5EBF0; --ink-2:#A9B5C0; --ink-3:#7C8995;
    --line:#29363F; --accent:#72AAD8; --accent-ink:#0E141A; --accent-soft:#1B3246;
    --warn:#E6A955; --warn-soft:#3A2A14; --ok:#6CC592; --ok-soft:#16301F; --danger:#E27A7D; --danger-soft:#3A1C1E;
    --hatch:#34414C; --shadow:0 10px 30px rgba(0,0,0,.5);
    --sea:#0E2230; --sea-halo:#15303F; --sea-ink:#6F97B0; --grat:rgba(150,190,215,.07); --land:#26323A; --land-2:#161F25; --land-near:#1F2A31; --sug:#F08A4B; --sug-ink:#F4A574; --land-line:#34424B; --land-line-2:#4A5B66; --now:#F07A45;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0E141A; --surface:#161F28; --surface-2:#1C2731; --ink:#E5EBF0; --ink-2:#A9B5C0; --ink-3:#7C8995;
  --line:#29363F; --accent:#72AAD8; --accent-ink:#0E141A; --accent-soft:#1B3246;
  --warn:#E6A955; --warn-soft:#3A2A14; --ok:#6CC592; --ok-soft:#16301F; --danger:#E27A7D; --danger-soft:#3A1C1E;
  --hatch:#34414C; --shadow:0 10px 30px rgba(0,0,0,.5);
  --sea:#0E2230; --sea-halo:#15303F; --sea-ink:#6F97B0; --grat:rgba(150,190,215,.07); --land:#26323A; --land-2:#161F25; --land-near:#1F2A31; --sug:#F08A4B; --sug-ink:#F4A574; --land-line:#34424B; --land-line-2:#4A5B66; --now:#F07A45;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg)}
body{margin:0;color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;padding-inline:16px;padding-block:0 96px}
.wrap{max-width:560px;margin:0 auto}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
a{color:var(--accent)}

/* header */
.top{padding-block:20px 10px;display:grid;gap:4px}
.eyebrow{font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
h1{font-family:var(--f-display);font-weight:400;font-size:30px;line-height:1.1;margin:0;text-wrap:balance}
.meta{color:var(--ink-2);font-size:14px;display:flex;flex-wrap:wrap;gap:4px 12px}
.meta b{color:var(--ink);font-weight:600}
.mode{font-size:12px;color:var(--warn);background:var(--warn-soft);border-radius:6px;padding:6px 10px;margin-top:6px}

/* strip */
.stripbox{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:8px 10px;border-bottom:1px solid var(--line)}
.strip{display:grid;grid-template-columns:repeat(var(--n),1fr);gap:2px}
.cell{height:30px;border:0;border-radius:3px;padding:0;display:flex;align-items:flex-end;justify-content:center;font-family:var(--f-mono);font-size:9px;color:#fff;font-weight:600;padding-bottom:2px;font-variant-numeric:tabular-nums}
.cell.none{background:repeating-linear-gradient(135deg,var(--hatch) 0 3px,transparent 3px 6px);color:var(--ink-3)}
.cell.gap{background:repeating-linear-gradient(135deg,var(--danger) 0 3px,transparent 3px 6px);color:var(--danger)}
.cell.fly{background:var(--ink-3);}
.cell.over{outline:2px solid var(--danger);outline-offset:-2px}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:8px;font-size:12px;color:var(--ink-2)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;flex:none}

/* sections */
.sechead{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-block:18px 10px}
h2{font-family:var(--f-display);font-weight:400;font-size:22px;margin:0}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 12px;font-weight:600;font-size:14px}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{color:var(--danger);border-color:var(--danger);background:transparent}
.btn.danger.armed{background:var(--danger);color:#fff}
.btn.ghost{background:transparent;border-color:transparent;color:var(--accent);padding-inline:6px}
.btn:disabled{opacity:.5;cursor:default}

/* day */
.days{display:grid;gap:12px}
.day{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;scroll-margin-top:110px}
.dayhead{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line)}
.dnum{font-family:var(--f-display);font-size:28px;line-height:1;width:34px;text-align:center;font-variant-numeric:tabular-nums}
.dinfo{flex:1;min-width:0}
.dwk{font-weight:600;text-transform:capitalize}
.dsub{font-family:var(--f-mono);font-size:11px;color:var(--ink-3);letter-spacing:.04em}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:4px 10px;font-size:13px;font-weight:600;color:#fff;white-space:nowrap;max-width:48%;overflow:hidden;text-overflow:ellipsis}
.rows{display:grid}
.row{display:grid;grid-template-columns:52px 1fr auto;gap:10px;align-items:start;padding:10px 14px;border:0;border-bottom:1px solid var(--line);background:transparent;text-align:left;width:100%}
.row:last-child{border-bottom:0}
.row:hover{background:var(--surface-2)}
.time{font-family:var(--f-mono);font-size:13px;font-weight:600;font-variant-numeric:tabular-nums;padding-top:1px}
.time.empty{color:var(--ink-3)}
.rtitle{font-weight:600;overflow-wrap:anywhere}
.rsub{font-size:13px;color:var(--ink-2);overflow-wrap:anywhere}
.tag{font-family:var(--f-mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);margin-right:6px}
.row.pseudo .rtitle{font-weight:500;color:var(--ink-2)}
.state{font-size:11px;font-weight:700;border-radius:999px;padding:3px 8px;white-space:nowrap}
.state.ok{background:var(--ok-soft);color:var(--ok)}
.state.pend{background:var(--warn-soft);color:var(--warn)}
.state.idea{background:var(--surface-2);color:var(--ink-3);border:1px solid var(--line)}
.dayfoot{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 8px 8px 14px;background:var(--surface-2);font-size:13px;color:var(--ink-2)}
.night.gap{color:var(--danger);font-weight:600}
.night.over{color:var(--danger);font-weight:600}
.empty-note{padding:12px 14px;color:var(--ink-3);font-size:13px}

/* bases */
.list{display:grid;gap:10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:grid;gap:6px}
.cardhead{display:flex;align-items:center;gap:10px}
.cardhead .city{font-family:var(--f-display);font-size:20px;flex:1;min-width:0}
.kv{display:grid;grid-template-columns:auto 1fr;gap:2px 12px;font-size:14px}
.kv dt{color:var(--ink-3)}
.kv dd{margin:0;overflow-wrap:anywhere}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.note{font-size:13px;color:var(--ink-2);white-space:pre-wrap}
.cardfoot{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px}

/* board (traslados) */
.board{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.brow{display:grid;grid-template-columns:62px 1fr auto;gap:10px;padding:12px 14px;border:0;border-bottom:1px solid var(--line);background:transparent;width:100%;text-align:left;align-items:start}
.brow:last-child{border-bottom:0}
.brow:hover{background:var(--surface-2)}
.bdate{font-family:var(--f-mono);font-size:12px;line-height:1.3;font-variant-numeric:tabular-nums}
.bdate b{display:block;font-size:14px}
.route{font-weight:600;overflow-wrap:anywhere}
.route .arr{color:var(--ink-3);font-weight:400;margin-inline:4px}

/* resumen */
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.stat .n{font-family:var(--f-display);font-size:26px;line-height:1.1;font-variant-numeric:tabular-nums}
.stat .l{font-size:12px;color:var(--ink-3)}
.warns{display:grid;gap:6px;margin-top:10px}
.warn{background:var(--danger-soft);color:var(--danger);border-radius:8px;padding:8px 12px;font-size:14px;font-weight:500}
.okmsg{background:var(--ok-soft);color:var(--ok);border-radius:8px;padding:8px 12px;font-size:14px;font-weight:500}
.people{display:flex;flex-wrap:wrap;gap:6px}
.person{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px 10px;font-size:13px}

/* nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.nav .in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(6,minmax(0,1fr))}
.nav button{border:0;background:transparent;padding:12px 1px 14px;font-size:11.5px;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600;color:var(--ink-3);border-top:2px solid transparent}
.nav button[aria-current="true"]{color:var(--accent);border-top-color:var(--accent)}

/* sheet */
.veil{position:fixed;inset:0;background:rgba(10,16,22,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:560px;max-height:92%;overflow:auto;border-radius:16px 16px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));box-shadow:var(--shadow)}
.sheet h3{font-family:var(--f-display);font-weight:400;font-size:22px;margin:0 0 12px}
form{display:grid;gap:12px}
.f{display:grid;gap:4px}
.f label{font-size:12px;font-weight:600;color:var(--ink-2)}
.f input,.f select,.f textarea{width:100%;border:1px solid var(--line);background:var(--surface-2);border-radius:8px;padding:10px;min-height:42px}
.f textarea{min-height:70px;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.check{display:flex;gap:10px;align-items:flex-start;font-size:14px}
.check input{width:18px;height:18px;margin-top:2px}
.actions{display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between;margin-top:4px}
.actions .r{display:flex;gap:8px;margin-left:auto}
.hint{font-size:12px;color:var(--ink-3)}

/* dashboard mes */
body.wide .wrap{max-width:1120px}
.seg{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;border-radius:6px;padding:6px 14px;font-weight:600;font-size:14px;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.kpis{display:flex;flex-wrap:wrap;align-items:center;gap:6px 16px;font-size:13px;color:var(--ink-2);margin:-2px 0 12px}
.kpis b{color:var(--ink);font-variant-numeric:tabular-nums}
.kpiwarn{border:0;background:var(--danger-soft);color:var(--danger);font-weight:700;font-size:12px;border-radius:999px;padding:3px 10px}
.mgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px}
.mwd{font-family:var(--f-mono);font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3);text-align:center;padding-bottom:2px}
.mc{background:var(--surface);border:1px solid var(--line);border-radius:6px;min-height:92px;padding-bottom:4px;overflow:hidden;display:flex;flex-direction:column;gap:2px;cursor:pointer;min-width:0}
.mc:hover{border-color:var(--ink-3)}
.mc.out{background:transparent;border-style:dashed;cursor:default;opacity:.45}
.mc.edge{border-color:var(--ink-2)}
.mband{height:5px;flex:none}
.mc.gapn .mband{background:repeating-linear-gradient(135deg,var(--danger) 0 3px,transparent 3px 6px)}
.mtop{display:flex;align-items:baseline;justify-content:space-between;gap:4px;padding:2px 5px 1px;min-width:0}
.mnum{font-family:var(--f-display);font-size:15px;line-height:1.1;white-space:nowrap;font-variant-numeric:tabular-nums}
.mcity{font-size:10px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.mi{font-size:10px;line-height:1.3;padding:1px 3px;margin:0 3px;border-radius:3px;background:var(--surface-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-left:2px solid transparent}
.mi.tras{background:var(--accent-soft)}
.mi.pend{border-left-color:var(--warn)}
.mi .mt{font-family:var(--f-mono);font-weight:600;margin-right:4px;display:none}
.mi.movingsel,.rowwrap.movingsel{outline:2px solid var(--accent);outline-offset:-2px}
.mlegend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--ink-3);margin-top:10px}
.mlegend span{display:inline-flex;align-items:center;gap:5px}
.sw{width:12px;height:10px;border-radius:2px;display:inline-block}
.pendsw{background:var(--surface-2);border-left:3px solid var(--warn)}
body.moving .mc:not(.out){outline:2px dashed var(--accent);outline-offset:-3px}
.dropover{outline:2px solid var(--accent)!important;outline-offset:-2px;background:var(--accent-soft)!important}
.dragging{opacity:.4}
@media (max-width:699px){ .mcity{display:none} .mi{pointer-events:none} }
@media (min-width:700px){
  .mc{min-height:128px}
  .mi{font-size:12px;padding:2px 5px;cursor:grab}
  .mi .mt{display:inline}
  .mnum{font-size:18px}
  .mcity{font-size:11px}
}
.rowwrap{display:flex;align-items:stretch;border-bottom:1px solid var(--line)}
.rowwrap:last-child{border-bottom:0}
.rowwrap .row{border-bottom:0;flex:1;min-width:0}
.mvbtn{border:0;border-left:1px solid var(--line);background:transparent;color:var(--ink-3);width:40px;font-size:16px;flex:none}
.mvbtn:hover{color:var(--accent);background:var(--surface-2)}
.movebar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(54px + env(safe-area-inset-bottom,0px));z-index:15;width:min(560px,calc(100% - 24px));background:var(--ink);color:var(--bg);border-radius:10px;padding:10px 10px 10px 14px;display:flex;align-items:center;gap:10px;font-size:13px;box-shadow:var(--shadow)}
.movebar span{flex:1;min-width:0}
.movebar .btn{background:transparent;color:var(--bg);border-color:var(--bg)}
/* mapa */
.mapgrid{display:grid;gap:14px;margin-top:14px}
.mapslot{min-width:0}
.mapbox{position:relative;height:min(58vh,480px);min-height:340px;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--sea)}
.map{display:block;width:100%;height:100%;touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none}
.map:active{cursor:grabbing}
.map .sea{fill:var(--sea)}
.map .grat{fill:none;stroke:var(--grat);stroke-width:.6}
.map .halo{fill:var(--sea-halo);stroke:var(--sea-halo);stroke-width:5;stroke-linejoin:round}
.map .land2{fill:var(--land-2);stroke:var(--land-line);stroke-width:.7;stroke-linejoin:round}
.map .land3{fill:var(--land-near);stroke:var(--land-line-2);stroke-width:.8;stroke-linejoin:round}
.map .ln{font-size:10.5px;letter-spacing:.18em;font-weight:600;fill:var(--ink-2);stroke:var(--land-near);stroke-width:3px;opacity:.8}
.map .lo{font-size:10px;letter-spacing:.16em;font-weight:600;fill:var(--ink-3);stroke:var(--land-2);stroke-width:3px;opacity:.55}
.map .sug{cursor:pointer}
.map .sug rect{fill:var(--sug);stroke:var(--surface);stroke-width:1.5}
.map .sughit{fill:transparent}
.map .suglab{font-size:11px;font-weight:600;fill:var(--sug-ink);stroke:var(--surface);stroke-width:3px}
.neartgl{position:absolute;top:10px;left:10px;display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 11px;font-size:12px;font-weight:600;color:var(--ink-2);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.neartgl[aria-pressed="false"]{opacity:.65}
.neartgl[aria-pressed="false"] .sugdot{background:transparent}
.sugdot{width:9px;height:9px;transform:rotate(45deg);background:var(--sug);border:1.5px solid var(--sug);display:inline-block;flex:none}
.sugrow{display:flex;align-items:center;gap:12px;width:100%;border:0;border-bottom:1px solid var(--line);background:transparent;text-align:left;padding:10px 14px}
.sugrow:last-child{border-bottom:0}
.sugrow:hover{background:var(--surface-2)}
.sugrow .sinfo{flex:1}
.sugrow b small{font-weight:500;color:var(--ink-3);font-size:12px}
.sugrow .sinfo span{white-space:normal}
.sugkm{display:grid;text-align:right;font-weight:700;font-size:13px;font-variant-numeric:tabular-nums;flex:none}
.sugkm small{font-weight:500;color:var(--ink-3);font-size:11px}
.map .land1{fill:var(--land);stroke:var(--land-line-2);stroke-width:.9;stroke-linejoin:round}
.map text{font-family:var(--f-body);paint-order:stroke;stroke-linejoin:round;pointer-events:none}
.map .lc{font-size:11px;letter-spacing:.22em;font-weight:600;fill:var(--ink-3);stroke:var(--land);stroke-width:3px;opacity:.75}
.map .ls{font-size:11.5px;font-style:italic;fill:var(--sea-ink);stroke:var(--sea);stroke-width:3px;letter-spacing:.04em}
.map .lint{font-size:11px;fill:var(--ink-2);stroke:var(--sea);stroke-width:3px;font-weight:600}
.map .intl{fill:none;stroke:var(--ink-3);stroke-width:2;stroke-dasharray:3 5;stroke-linecap:round}
.map .leg{cursor:pointer}
.map .legline{fill:none;stroke-linecap:round;transition:opacity .2s}
.map .leghit{fill:none;stroke:transparent;stroke-width:22}
.map .legglow{fill:none;stroke:var(--surface);stroke-width:9;stroke-linecap:round;opacity:.9}
.map .leg.fut .legline{opacity:.55}
.map .leg.fut .legbadge,.map .leg.fut svg{opacity:.8}
.map .legbadge{fill:var(--surface);stroke-width:2}
.map .leg.next .legbadge{stroke-width:3}
.map .legline.run{stroke-dasharray:10 8;animation:run 1s linear infinite}
@keyframes run{to{stroke-dashoffset:-18}}
.map .pin{cursor:pointer}
.map .pindot{fill:var(--surface);stroke-width:3.5}
.map .pinnum{font-size:11.5px;font-weight:700;fill:var(--ink);stroke:none}
.map .pinlab{font-size:13px;font-weight:700;fill:var(--ink);stroke:var(--surface);stroke-width:4px}
.map .herering{fill:none;stroke:var(--now);stroke-width:2.5;opacity:.8}
.map .nowmk circle{fill:var(--now);stroke:var(--surface);stroke-width:2.5}
@media (prefers-reduced-motion:no-preference){.map .herering{animation:pulse 1.8s ease-out infinite;transform-box:fill-box;transform-origin:center}@keyframes pulse{0%{opacity:.9;transform:scale(.8)}100%{opacity:0;transform:scale(1.35)}}}
.mapctl{position:absolute;top:10px;right:10px;display:grid;gap:6px}
.mapctl button{width:38px;height:38px;border-radius:9px;border:1px solid var(--line);background:var(--surface);font-size:20px;line-height:1;display:grid;place-items:center;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}

function cfgPreview(){
  var s=document.getElementById("cStart").value,e=document.getElementById("cEnd").value;

  info.textContent=(diff(e,s)+1)+" días · "+diff(e,s)+" noches";
  var shift=document.getElementById("cShift").checked, d=diff(s,S.trip.start);
  var n=0;
  S.items.forEach(function(i){var x=shift?add(i.date,d):i.date;if(x<s||x>e)n++;});
  S.bases.forEach(function(b){var a=shift?add(b.checkIn,d):b.checkIn,c=shift?add(b.checkOut,d):b.checkOut;if(a<s||c>e)n++;});
  if(n){w.hidden=false;w.textContent=n+(n===1?" elemento queda":" elementos quedan")+" fuera de las nuevas fechas. No se borran, pero vas a tener que moverlos.";}

      var chain=Promise.resolve();
      S.bases.slice().forEach(function(b){chain=chain.then(function(){var n=Object.assign({},b);delete n.id;n.checkIn=add(b.checkIn,d);n.checkOut=add(b.checkOut,d);return save("bases",b.id,n,true);});});

      chain.then(function(){cfgDirty=false;render();toast("Guardado. Itinerario movido "+(d>0?"+":"")+d+" días");});
    });
  });

function problems(){
  var w=[];
  days().forEach(function(d){var ns=nightState(d);
    if(ns.k==="gap") w.push("La noche del "+short(d)+" no tiene hospedaje.");
    if(ns.k==="over") w.push("La noche del "+short(d)+" tiene dos hospedajes ("+ns.bs.map(function(b){return b.city;}).join(" y ")+").");
  });
  S.bases.forEach(function(b){ if(b.checkIn&&b.checkOut&&b.checkOut<=b.checkIn) w.push(b.city+": el check-out es anterior o igual al check-in."); });
  var oor=outOfRange(S.trip.start,S.trip.end);
  if(oor) w.push(oor+(oor===1?" elemento quedó":" elementos quedaron")+" fuera de las fechas del viaje (revisá Bases y Traslados).");
  var sb=sortedBases();
  for(var k=1;k<sb.length;k++){var a=sb[k-1],b=sb[k];
    if(a.checkOut===b.checkIn&&a.city!==b.city){
      var moved=S.items.some(function(i){return i.date===b.checkIn&&i.type==="traslado";});
      if(!moved) w.push("Falta el traslado "+a.city+" → "+b.city+" del "+short(b.checkIn)+".");
    }
  }
  S.items.forEach(function(i){
    if(i.type!=="excursion") return;
    var b=baseOfDate(i.date);
    if(!b){w.push("La excursión a "+(i.dest||"?")+" del "+short(i.date)+" no tiene una base esa noche.");return;}
    var bc=coordsOf(b),dc=coordsOf({city:i.dest,lat:i.lat,lon:i.lon});if(!bc||!dc) return;
    var km=hav(bc,dc),h=estHours(km,i.mode);
    if(h>2.5) w.push((i.dest||"?")+" queda a "+kmTxt(km)+" de "+b.city+" (≈ "+hTxt(h)+" por trayecto): conviene hacerla base y dormir ahí.");
  });
  return w;
}

    '</div><div class="warns">'+(w.length?w.map(function(x){return '<div class="warn">'+esc(x)+'</div>';}).join(""):'<div class="okmsg">Todas las noches tienen hospedaje y todos los cambios de ciudad tienen traslado.</div>')+'</div>';
  if(trav.length) h+='<div class="sechead"><h2>Viajeros</h2></div><div class="people">'+trav.map(function(t){return '<span class="person">'+esc(t)+'</span>';}).join("")+'</div>';

  }).join("")+'</div>';

    var a=this.value;if(a&&b.checkIn&&b.checkOut){var n=diff(b.checkOut,b.checkIn);var o=document.getElementById("bOut");if(!o.dataset.touched)o.value=add(a,n);}upd();});
  document.getElementById("bOut").addEventListener("change",function(){this.dataset.touched="1";upd();});

  document.getElementById("fBase").addEventListener("submit",function(e){
    e.preventDefault();
    var v=function(id){return document.getElementById(id).value.trim();};
    var o={city:v("bCity"),checkIn:v("bIn"),checkOut:v("bOut"),hotel:v("bHotel"),address:v("bAddr"),status:v("bStatus"),cost:v("bCost"),link:v("bLink"),notes:v("bNotes")};
    if(!isNew&&norm(o.city)===norm(b.city)&&b.lat!=null&&b.lat!==""){o.lat=b.lat;o.lon=b.lon;}
    else {var gz=gaz(o.city);o.lat=gz?gz[1]:null;o.lon=gz?gz[2]:null;}
    if(!o.city){toast("Poné la ciudad.");return;}
    if(!o.checkIn||!o.checkOut||o.checkOut<=o.checkIn){toast("El check-out tiene que ser posterior al check-in.");return;}
    var shift=!isNew&&document.getElementById("bShift").checked&&b.checkIn&&o.checkIn!==b.checkIn;
    save("bases",isNew?null:b.id,o).then(function(ok){
      if(!ok) return;
      if(!shift){closeSheet();toast("Guardado");return;}
      var delta=diff(o.checkIn,b.checkIn);
      var mv=S.items.filter(function(i){return i.date>b.checkIn&&i.date<b.checkOut;});
      var chain=Promise.resolve(true);
      mv.forEach(function(i){chain=chain.then(function(){var n=Object.assign({},i);delete n.id;n.date=add(i.date,delta);return save("items",i.id,n,true);});});
      chain.then(function(){closeSheet();toast("Guardado. "+mv.length+" planes movidos "+(delta>0?"+":"")+delta+" días");});
    });
  });
}

/* ---------- persistence ---------- */
function save(col,id,data,quiet){
  if(col==="items"&&isFixedId(id)) return Promise.resolve(true);
  if(S.mode==="fb") return fbSet(col+"/"+(id||newBaseId()),clean(data));
  if(isLocal()){
    var arr=col==="bases"?S.bases:S.items;
    if(id){var k=arr.findIndex(function(x){return x.id===id;});if(k>=0) arr[k]=Object.assign({id:id},data); else arr.push(Object.assign({id:id},data));} else arr.push(Object.assign({id:"x"+Math.random().toString(36).slice(2,9)},data));
    persistLocal();render();return Promise.resolve(true);
  }
  if(!db||readOnly){toast("No se puede guardar ahora.");return Promise.resolve(false);}
  var ref=id?db.collection(col).doc(id):db.collection(col).doc();
  return ref.set(data).then(function(){return true;},function(e){return dbErr(e,quiet);});
}
function remove(col,id){
  if(col==="items"&&isFixedId(id)) return Promise.resolve(true);
  if(S.mode==="fb") return fbSet(col+"/"+id,null);
  if(isLocal()){var arr=col==="bases"?S.bases:S.items;var k=arr.findIndex(function(x){return x.id===id;});if(k>=0)arr.splice(k,1);persistLocal();render();return Promise.resolve(true);}
  if(!db) return Promise.resolve(false);
  return db.collection(col).doc(id).delete().then(function(){return true;},function(e){return dbErr(e);});
}
function dbErr(e,quiet){
  var c=e&&e.code;
  if(c==="invalid_argument"){readOnly=true;render();toast("No tenés permiso para editar este viaje.");}
  else if(c==="quota_exceeded") toast("Se llenó el espacio del viaje. Borrá planes viejos para seguir.");
  else if(!quiet) toast("No se pudo guardar. Probá de nuevo en un momento.");
  return false;
}

/* circuito = bases en orden + tramos entre ellas */
function legItemOf(b,prev){
  var c=S.items.filter(function(i){return i.type==="traslado"&&i.date===b.checkIn;});
  if(!c.length) return null;
  var nb=norm(b.city),np=prev?norm(prev.city):"";
  var byTo=c.find(function(i){var t=norm(i.to);return t&&(t.indexOf(nb)>=0||nb.indexOf(t)>=0);});
  if(byTo) return byTo;
  var byFrom=c.find(function(i){var f=norm(i.from);return np&&f&&(f.indexOf(np)>=0||np.indexOf(f)>=0);});
  return byFrom||c[0];
}
function circuit(){
  var st=sortedBases().filter(function(b){return b.checkIn&&b.checkOut;});
  var legs=[];
  for(var k=1;k<st.length;k++) legs.push({i:k-1,from:st[k-1],to:st[k],date:st[k].checkIn,item:legItemOf(st[k],st[k-1])});
  return {stops:st,legs:legs};
}
function intlLegs(){
  var isHome=function(s){var n=norm(s);return n.indexOf("ezeiza")>=0||n.indexOf("buenos aires")>=0||n.indexOf("aeroparque")>=0||n.indexOf("rosario")>=0||n.indexOf("argentina")>=0;};
  return {out:S.items.find(function(i){return i.type==="traslado"&&isHome(i.from);}),back:S.items.find(function(i){return i.type==="traslado"&&isHome(i.to);})};
}

/* aplica un nuevo orden/noches del circuito y reacomoda fechas, planes y tramos */
function applyPlan(plan,msg){
  var old=circuit(),oldStops=old.stops;
  var start=oldStops.length?oldStops[0].checkIn:add(S.trip.start,1);
  var cur=start;plan.forEach(function(p){p.in=cur;p.out=add(cur,p.n);cur=p.out;});
  var byId={};plan.forEach(function(p){byId[p.b.id]=p;});

      '</div>';
  });
  h+='<div class="hint">Al sumar o restar noches, las paradas siguientes se corren con sus planes. Al quitar una parada, sus noches pasan a la anterior.</div><div class="actions"><div class="r"><button type="button" class="btn" data-act="close">Cerrar</button></div></div>';
  openSheet(h);
}
function addStopSheet(pre){
  var cc=circuit();pre=pre||{};var defAfter=pre.after!=null?pre.after:cc.stops.length-1;
  openSheet('<h3>Nueva parada</h3><form id="fStop">'+
    '<div class="f"><label for="sCity">Ciudad</label><input id="sCity" list="gzList" required placeholder="Ej: Nápoles" autocomplete="off" value="'+esc(pre.city||"")+'"><datalist id="gzList">'+GZ.map(function(g){return '<option value="'+esc(g[0])+'">';}).join("")+'</datalist><div class="hint" id="sFound"></div></div>'+
    '<div class="two"><div class="f"><label for="sAfter">Va después de</label><select id="sAfter"><option value="-1"'+(defAfter===-1?" selected":"")+'>Al principio</option>'+cc.stops.map(function(b,k){return '<option value="'+k+'"'+(k===defAfter?" selected":"")+'>'+(k+1)+'. '+esc(b.city)+'</option>';}).join("")+'</select></div>'+
    '<div class="f"><label for="sNights">Noches</label><input id="sNights" type="number" min="1" max="20" value="2"></div></div>'+
    '<div class="hint">Las noches se descuentan de la parada anterior, así la fecha de regreso no cambia.</div>'+
    '<div class="actions"><div class="r"><button type="button" class="btn" data-act="close">Cancelar</button><button type="submit" class="btn primary">Agregar</button></div></div></form>');
  var ci=document.getElementById("sCity"),fd=document.getElementById("sFound");
  var upd=function(){var g=gaz(ci.value);fd.textContent=ci.value.trim()?(g?"Ubicación encontrada: "+g[0]:"No la tengo en la lista: después la marcás tocando el mapa."):"";};
  ci.addEventListener("input",upd);upd();
  document.getElementById("fStop").addEventListener("submit",function(e){
    e.preventDefault();var city=ci.value.trim();if(!city){toast("Escribí la ciudad.");return;}
    var n=Math.max(1,Math.min(20,parseInt(document.getElementById("sNights").value,10)||1)),after=parseInt(document.getElementById("sAfter").value,10);
    var g=gaz(city),id=newBaseId();
    var base={id:id,city:g&&norm(g[0])===norm(city)?g[0]:city,status:"idea",hotel:"",address:"",cost:"",link:"",notes:"",lat:g?g[1]:null,lon:g?g[2]:null};
    closeSheet();if(!g) S.placing=id;
    opInsert(after,base,n);
  });
}

/* ---------- copy ---------- */
function itineraryText(){
  var out=[(S.trip.name||"Viaje")+" · "+dn(S.trip.start)+" "+mo(S.trip.start)+" al "+dn(S.trip.end)+" "+mo(S.trip.end)+" "+S.trip.end.slice(0,4),""];
  days().forEach(function(d){
    var ns=nightState(d);
    out.push(short(d).toUpperCase()+(ns.k==="ok"?" — "+ns.b.city:""));
    var its=S.items.filter(function(i){return i.date===d;}).sort(function(a,b){return (a.time||"99").localeCompare(b.time||"99");});
    its.forEach(function(i){out.push("  "+(i.time||"--:--")+"  "+(i.type==="traslado"?(i.from||"?")+" → "+(i.to||"?")+" ("+(i.mode||"")+")":i.type==="excursion"?"Excursión de día a "+(i.dest||"?")+(i.mode?" ("+i.mode+")":"")+(i.endTime?", vuelven "+i.endTime:""):i.title));});
    if(ns.k==="ok") out.push("  Noche: "+(ns.b.hotel||"hospedaje a definir")+", "+ns.b.city);
    out.push("");
  });
  return out.join("\n");
}
function copyText(){
  var t=itineraryText();
  var fallback=function(){openSheet('<h3>Itinerario</h3><div class="f"><label for="cpy">Seleccioná y copiá</label><textarea id="cpy" style="min-height:300px">'+esc(t)+'</textarea></div><div class="actions"><div class="r"><button type="button" class="btn" data-act="close">Cerrar</button></div></div>');var a=document.getElementById("cpy");a.focus();a.select();};
  try{navigator.clipboard.writeText(t).then(function(){toast("Itinerario copiado. Pegalo en WhatsApp.");},fallback);}catch(e){fallback();}
}

/* ---------- events ---------- */
var tt;
function toast(m){var el=document.getElementById("toast");el.textContent=m;el.hidden=false;clearTimeout(tt);tt=setTimeout(function(){el.hidden=true;},2600);}
function setTab(t){S.tab=t;try{localStorage.setItem("eu27tab",t);}catch(e){}render();window.scrollTo(0,0);}
document.querySelector(".nav").addEventListener("click",function(e){var b=e.target.closest("button[data-tab]");if(b) setTab(b.dataset.tab);});
document.addEventListener("click",function(e){
  var el=e.target.closest("[data-act]");if(!el) return;
  var a=el.dataset.act;
  if(a==="veil"){if(e.target===el) closeSheet();return;}
  if(a==="close"){closeSheet();return;}
  if(a==="goto"){var d=el.dataset.date;if(!d) return;if(S.tab!=="cal"){S.tab="cal";render();}var t=document.getElementById("d-"+d);if(t) t.scrollIntoView({behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth",block:"start"});return;}
  if(a==="copy"){copyText();return;}
  if(a==="mz"){var mr=mapSvg.getBoundingClientRect();zoomAt(mr.left+mr.width/2,mr.top+mr.height/2,+el.dataset.z);return;}
  if(a==="mfit"){fitMap();drawMap();return;}
  if(a==="mplay"){togglePlay(el);return;}
  if(a==="leg"){legSheet(+el.dataset.l);return;}
  if(a==="pin"){stopSheet(el.dataset.ids.split(","));return;}
  if(a==="sug"){sugSheet(el.dataset.n);return;}
  if(a==="neartgl"){S.showNear=S.showNear===false;el.setAttribute("aria-pressed",S.showNear?"true":"false");drawMap();if(S.tab==="map"){}return;}
  if(a==="stop"){stopSheet([el.dataset.id]);return;}
  if(a==="place-cancel"){S.placing=null;drawMap();return;}
  var canE=S.mode!=="loading"&&!readOnly;
  if(a==="place"&&canE){S.placing=el.dataset.id;closeSheet();if(S.tab!=="map"){S.tab="map";render();}else drawMap();return;}
  if(a==="nights"&&canE){closeSheet();opNights(el.dataset.id,+el.dataset.d);return;}
  if(a==="smove"&&canE){closeSheet();opMove(el.dataset.id,+el.dataset.d);return;}
  if(a==="setmode"&&canE){setLegMode(+el.dataset.l,el.dataset.m);return;}
  if(a==="add-stop"&&canE){addStopSheet();return;}
  if(a==="add-exc"&&canE){var eb=S.bases.find(function(x){return x.id===el.dataset.id;});if(eb) itemSheet(null,{type:"excursion",date:defaultExcDate(eb),dest:el.dataset.dest||""});return;}
  if(a==="sug-day"&&canE){closeSheet();var sb2=S.bases.find(function(x){return x.id===el.dataset.id;});if(sb2) itemSheet(null,{type:"excursion",date:defaultExcDate(sb2),dest:el.dataset.n});return;}
  if(a==="sug-add"&&canE){addStopSheet({city:el.dataset.n,after:+el.dataset.after});return;}
  if(a==="sremove"&&canE){
    if(!el.classList.contains("armed")){el.classList.add("armed");el.textContent="¿Seguro? Quitar";return;}
    closeSheet();opRemove(el.dataset.id);return;
  }
  if(a==="export"){
    var blob=new Blob([JSON.stringify({trip:S.trip,bases:S.bases,items:userItems(),savedAt:new Date().toISOString()},null,2)],{type:"application/json"});
    var u=URL.createObjectURL(blob),ln=document.createElement("a");ln.href=u;ln.download="viaje-europa-2027-"+iso(Date.now())+".json";document.body.appendChild(ln);ln.click();ln.remove();setTimeout(function(){URL.revokeObjectURL(u);},2000);
    toast("Archivo exportado");return;
  }
  if(a==="reset-all"){
    var rp=document.getElementById("rPass"),re=document.getElementById("rErr");
    if(!rp||rp.value!=="Europa2027"){if(re){re.hidden=false;re.textContent="Contraseña incorrecta.";}el.classList.remove("armed");el.textContent="Borrar todo el viaje";return;}
    if(re) re.hidden=true;
    if(!el.classList.contains("armed")){el.classList.add("armed");el.textContent="¿Seguro? Se borra todo";return;}
    var done=function(){cfgDirty=false;document.getElementById("main").innerHTML="";render();toast("Viaje vacío. Empezá por Mapa → + Parada.");};
    if(S.mode==="fb"){Promise.all([fbSet("bases",null),fbSet("items",null)]).then(done);return;}
    if(isLocal()){S.bases=[];S.items=[];persistLocal();done();return;}
    var W=S.bases.map(function(b){return {col:"bases",id:b.id,del:true};}).concat(S.items.map(function(x){return {col:"items",id:x.id,del:true};}));
    runWrites(W,"Viaje vacío. Empezá por Mapa → + Parada.").then(function(){cfgDirty=false;});
    return;
  }
  if(a==="reset-seed"){
    if(!el.classList.contains("armed")){el.classList.add("armed");el.textContent="¿Seguro? Se pierden tus cambios";return;}
    try{localStorage.removeItem(LKEY);}catch(x){}
    loadData(window.EU27_SEED);cfgDirty=false;persistLocal();document.getElementById("main").innerHTML="";render();toast("Itinerario original restaurado");return;
  }
  if(a==="view"){S.view=el.dataset.v;try{localStorage.setItem("eu27view",S.view);}catch(x){}render();return;}
  if(a==="tab"){setTab(el.dataset.t);return;}
  if(a==="cancel-move"){S.moving=null;render();return;}
  if(a==="move"){S.moving=el.dataset.id;closeSheet();if(S.tab!=="cal")S.tab="cal";render();return;}
  if(a==="drop-here"){moveTo(S.moving,el.dataset.date);return;}
  if(a==="golist"){closeSheet();S.view="lista";render();var g=document.getElementById("d-"+el.dataset.date);if(g)g.scrollIntoView({block:"start"});return;}
  if(a==="cell"||a==="chip"){
    var cell=el.closest(".mc");var cd=cell&&cell.dataset.date;if(!cd) return;
    if(S.moving){moveTo(S.moving,cd);return;}
    if(a==="chip"&&window.innerWidth>=700&&S.mode!=="loading"&&!readOnly){var ci=S.items.find(function(x){return x.id===el.dataset.id;});if(ci){itemSheet(ci);return;}}
    daySheet(cd);return;
  }
  if(a==="cfg-reset"){cfgDirty=false;document.getElementById("main").innerHTML="";render();return;}
  var can=S.mode!=="loading"&&!readOnly;
  if(a==="add-item"&&can){itemSheet(null,{date:el.dataset.date||firstFree(),type:el.dataset.type});return;}
  if(a==="edit-item"){var it=S.items.find(function(x){return x.id===el.dataset.id;});if(it&&it.fixed){fixedSheet(it);return;}if(it&&can) itemSheet(it);return;}
  if(a==="add-base"&&can){baseSheet(null);return;}
  if(a==="edit-base"){var bb=S.bases.find(function(x){return x.id===el.dataset.id;});if(bb&&can) baseSheet(bb);return;}
  if(a==="del-item"||a==="del-base"){
    if(!el.classList.contains("armed")){el.classList.add("armed");el.textContent="¿Seguro? Eliminar";return;}
    remove(a==="del-item"?"items":"bases",el.dataset.id).then(function(ok){if(ok){closeSheet();toast("Eliminado");}});
  }
});
document.addEventListener("change",function(e){
  if(e.target.id!=="impFile"||!e.target.files||!e.target.files[0]) return;
  var r=new FileReader();
  r.onload=function(){
    try{var o=JSON.parse(r.result);if(!o||!o.trip||!Array.isArray(o.items)||!Array.isArray(o.bases)) throw 0;
      loadData(o);cfgDirty=false;persistLocal();document.getElementById("main").innerHTML="";render();toast("Datos importados");}
    catch(x){toast("Ese archivo no es un itinerario exportado desde esta app.");}
  };
  r.readAsText(e.target.files[0]);
});
document.addEventListener("keydown",function(e){
  if(e.key==="Escape"){ if(document.getElementById("sheetRoot").innerHTML) closeSheet(); else if(S.moving){S.moving=null;render();} }
  if((e.key==="Enter"||e.key===" ")&&e.target.classList&&e.target.classList.contains("mc")&&e.target.dataset.date){e.preventDefault();e.target.click();}
});
/* drag & drop (compu) */
var dragId=null;
document.addEventListener("dragstart",function(e){var el=e.target.closest&&e.target.closest("[data-drag]");if(!el) return;dragId=el.dataset.drag;try{e.dataTransfer.setData("text/plain",dragId);e.dataTransfer.effectAllowed="move";}catch(x){}el.classList.add("dragging");});
document.addEventListener("dragend",function(e){dragId=null;document.querySelectorAll(".dragging,.dropover").forEach(function(x){x.classList.remove("dragging","dropover");});});
document.addEventListener("dragover",function(e){if(!dragId) return;var t=e.target.closest&&e.target.closest("[data-drop]");if(!t) return;e.preventDefault();document.querySelectorAll(".dropover").forEach(function(x){if(x!==t)x.classList.remove("dropover");});t.classList.add("dropover");});
document.addEventListener("drop",function(e){var t=e.target.closest&&e.target.closest("[data-drop]");if(!t||!dragId) return;e.preventDefault();var id=dragId;dragId=null;t.classList.remove("dropover");moveTo(id,t.dataset.drop);});
function firstFree(){var today=iso(Date.now());return (today>=S.trip.start&&today<=S.trip.end)?today:S.trip.start;}

render();
start();
})();
</script>
